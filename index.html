<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="¡Mi cumpleaños!">
    <meta property="og:description"
        content="Te invitamos a celebrar este día tan especial con nosotros. Haz clic para abrir tu invitación.">
    <meta property="og:url" content="EL_ENLACE_DE_TU_INVITACION">

    <title>Invitación de Oscar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chonburi&family=Goblin+One&family=Orbitron:wght@400..900&family=Roboto&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="intro-overlay">
        <div class="intro-content">
            <section class="hero">
                <div class="stranger-title">
                    <span class="letter" style="--d:0s">O</span>
                    <span class="letter" style="--d:0.1s">S</span>
                    <span class="letter" style="--d:0.2s">C</span>
                    <span class="letter" style="--d:0.3s">A</span>
                    <span class="letter" style="--d:0.4s">R</span>
                </div>
            </section>
            <button id="enter-btn">INGRESAR ...</button>
        </div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <button id="muteBtn" class="audio-control-btn">
        <i id="audioIcon" class="fa-solid fa-volume-high"></i>
    </button>

    <div class="screen-frame">

        <div class="logo-area">
            <img src="images/logoStrangerLinea.png" alt="Stranger Things" class="main-logo">
            <span class="season-tag">SEASON 7</span>
        </div>

        <div class="subtitle">LA GRIETA SE HA ABIERTO...</div>

        <div class="dashboard-content">

            <section class="room-scene fade-in">
                <img src="images/foto.png" alt="Room Scene" class="responsive-img polaroid" />
            </section>

            <div class="info-container">
                <div class="section-label">REPORTE DE MISIÓN: </div>
                <div class="event-title">EL REENCUENTRO</div>

                <div class="section-label">COORDENADAS DE TIEMPO:</div>
                <div class="time-coordinates">DOMINGO, 19 JULIO, 04:00 P.M.</div>


                <div class="section-label">Base secreta</div>
                <div class="map-container">
                    <img src="images/mapaStranger.png" alt="Mapa de Hawkins"
                        style="width: 100%; height: auto; display: block; border-radius: 4px;">
                    <a href="https://maps.app.goo.gl/gYmpGY7Y1ZkxZWpc7" class="btn-outline">Ver Mapa ...</a>
                </div>


                <div class="section-label">MENSAJE RECIBIDO:</div>

                <div class="lights-section">
                    <img src="images/hilo.png" alt="Hilo de luces" class="lights-wire">
                    <div class="lights-string">
                        <div class="light-container animation-1">
                            <div class="light-bulb red"></div>
                            <div class="light-letter">O</div>
                        </div>
                        <div class="light-container animation-2">
                            <div class="light-bulb blue"></div>
                            <div class="light-letter">S</div>
                        </div>
                        <div class="light-container animation-3">
                            <div class="light-bulb yellow"></div>
                            <div class="light-letter">C</div>
                        </div>
                        <div class="light-container animation-4">
                            <div class="light-bulb green"></div>
                            <div class="light-letter">A</div>
                        </div>
                        <div class="light-container animation-5">
                            <div class="light-bulb red"></div>
                            <div class="light-letter">R</div>
                        </div>
                    </div>
                </div>
            </div>



        </div>

        <footer class="footer-stranger fade-in">
        <div class="linea-neon-roja"></div>

        <p class="texto-creativo">
            Codificado desde Hawkins
        </p>

        <p class="firma-ano">Oscar &copy; 2026</p>
        <a href="https://wa.me/528119036004?text=Hola%20Ari,%20vi%20la%20invitación%20de%20Oscar%20y%20me%20encantó.%20¿Me%20podrías%20cotizar%20una%20para%20mi%20evento?"
            class="link-contacto-stranger" target="_blank">
            Diseño y desarrollo por Ari | Cotiza aquí
        </a>
    </footer>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
